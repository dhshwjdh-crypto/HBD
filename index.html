<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok Surprise</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
    
    /* Резкое переключение вместо плавного scroll-behavior */
    .tiktok-container { 
      width: 100%; 
      height: 100vh; 
      overflow-y: scroll; 
      snap-type: y mandatory; 
    }
    .tiktok-container::-webkit-scrollbar { display: none; }
    
    .slide { 
      position: relative; 
      width: 100%; 
      height: 100vh; 
      snap-align: start; 
      snap-stop: always; /* Принудительная остановка на каждом слайде */
      display: flex; 
      justify-content: center; 
      align-items: center; 
      background: #000; 
    }
    
    /* Все видео отображаются целиком (fit-contain) */
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      cursor: pointer; 
      will-change: transform; 
      transform: translateZ(0); 
    }

    .overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%); pointer-events: none; }
    .info-panel { position: absolute; bottom: 25px; left: 15px; right: 80px; z-index: 10; }
    .author { font-weight: 700; font-size: 16px; margin-bottom: 8px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .description-container { font-size: 14px; line-height: 1.4; color: #f1f1f1; }
    .description-preview { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
    .more-btn { display: inline-block; margin-left: 5px; color: #bbb; font-weight: bold; cursor: pointer; }
    .side-bar { position: absolute; right: 12px; bottom: 40px; display: flex; flex-direction: column; align-items: center; gap: 22px; z-index: 10; }
    .action-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .action-btn svg { width: 34px; height: 34px; fill: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); transition: transform 0.1s ease; }
    .action-btn:active svg { transform: scale(1.2); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: flex-end; }
    .modal-content { background: #1e1e1e; width: 100%; max-height: 60vh; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 20px; box-sizing: border-box; overflow-y: auto; animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .close-btn { font-size: 20px; cursor: pointer; color: #888; }
    .modal-body { font-size: 15px; line-height: 1.5; white-space: pre-line; color: #ddd; }
  </style>
</head>
<body>

<div class="tiktok-container">

  <!-- СЛАЙД 1 -->
  <div class="slide">
    <video src="video1.mp4" loop playsinline muted autoplay preload="metadata"></video>
    <div class="overlay"></div>
    <div class="info-panel">
      <div class="author">@твой_никнейм</div>
      <div class="description-container">
        <span class="description-preview">Короткое начало первого описания...</span>
        <span class="more-btn" onclick="openModal(1)">ещё</span>
      </div>
    </div>
    <div class="side-bar">
      <div class="action-btn" onclick="toggleLike(this)"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
      <div class="action-btn" onclick="openModal(1)"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H
